[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-guide"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "deepagents>=0.7.28",
    "langchain-deepseek",
    "pydantic",
    "python-dotenv",
    "httpx",
    "fastmcp",
    "fastapi",
    "uvicorn",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
]

[tool.setuptools.packages.find]
include = ["app*"]
